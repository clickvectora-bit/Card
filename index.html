<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <title>PDF Web Page Viewer</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PDF.js library to render PDF on HTML Canvas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        .checkerboard {
            background-image: linear-gradient(45deg, #e2e8f0 25%, transparent 25%), 
                              linear-gradient(-45deg, #e2e8f0 25%, transparent 25%), 
                              linear-gradient(45deg, transparent 75%, #e2e8f0 75%), 
                              linear-gradient(-45deg, transparent 75%, #e2e8f0 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="h-full bg-slate-100 text-slate-800 flex flex-col overflow-hidden">

  <!-- Header Navigation -->
  <header class="h-16 bg-white border-b border-slate-200 px-4 flex items-center justify-between z-30 shrink-0 shadow-sm">
    <div class="flex items-center space-x-3">
      <h1 class="font-bold text-slate-900 text-sm sm:text-base"><i class="fa-solid fa-file-pdf text-indigo-600 mr-2"></i>PDF Web Page Viewer</h1>
    </div>

    <!-- Controls: Download Button -->
    <div class="flex items-center space-x-3">
      <button onclick="downloadPDF()" class="px-3 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl font-medium text-xs shadow-md flex items-center space-x-1.5 transition">
        <i class="fa-solid fa-download"></i>
        <span>Download PDF</span>
      </button>
    </div>
  </header>

  <!-- App Layout Container -->
  <div class="flex-1 flex overflow-hidden relative">
    
    <!-- Main Workspace Area where PDF renders on Canvas -->
    <main class="flex-1 bg-slate-200/70 checkerboard relative flex items-center justify-center overflow-hidden" id="workspaceContainer">
      <div id="canvasViewport" class="absolute inset-0 flex items-center justify-center overflow-auto p-4">
        <div id="canvasWrapper" class="relative shadow-2xl bg-white rounded-lg overflow-hidden border border-slate-300">
          <canvas id="pdfCanvas"></canvas>
        </div>
      </div>

      <!-- Page Switching Widget -->
      <div class="absolute bottom-6 bg-white/90 backdrop-blur border border-slate-200 rounded-2xl px-4 py-2.5 shadow-xl z-20 flex items-center space-x-4">
        <button onclick="changePage(-1)" class="w-8 h-8 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 flex items-center justify-center transition">
          <i class="fa-solid fa-chevron-left text-xs"></i>
        </button>
        <span class="text-xs font-semibold text-slate-700">Page <span id="currentPageNum">1</span> of <span id="totalPageCount">1</span></span>
        <button onclick="changePage(1)" class="w-8 h-8 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 flex items-center justify-center transition">
          <i class="fa-solid fa-chevron-right text-xs"></i>
        </button>
      </div>
    </main>
  </div>

  <script>
    let pdfDoc = null;
    let pageNum = 1;
    let scale = 1.2;
    let canvas = document.getElementById('pdfCanvas');
    let ctx = canvas.getContext('2d');

    // Default pre-loaded PDF file path or URL
    const defaultPdfUrl = 'card 1.pdf'; 

    window.onload = function() {
      loadPDF(defaultPdfUrl);
    };

    // Load PDF automatically from URL/path
    async function loadPDF(url) {
      try {
        const loadingTask = pdfjsLib.getDocument(url);
        pdfDoc = await loadingTask.promise;
        document.getElementById('totalPageCount').textContent = pdfDoc.numPages;
        pageNum = 1;
        renderPage(pageNum);
      } catch (error) {
        console.error("Error loading default PDF:", error);
      }
    }

    // Render individual page onto HTML5 Canvas
    async function renderPage(num) {
      if (!pdfDoc) return;
      const page = await pdfDoc.getPage(num);
      const viewport = page.getViewport({ scale: scale });
      
      canvas.height = viewport.height;
      canvas.width = viewport.width;

      const renderContext = {
        canvasContext: ctx,
        viewport: viewport
      };
      
      await page.render(renderContext).promise;
      document.getElementById('currentPageNum').textContent = num;
    }

    function changePage(val) {
      if (!pdfDoc) return;
      let newPage = pageNum + val;
      if (newPage < 1 || newPage > pdfDoc.numPages) return;
      pageNum = newPage;
      renderPage(pageNum);
    }

    // Handle PDF download action
    function downloadPDF() {
      const a = document.createElement('a');
      a.href = defaultPdfUrl;
      a.download = defaultPdfUrl.split('/').pop() || 'document.pdf';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }
  </script>
</body>
</html>
