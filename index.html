<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open PDF in Browser</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }
        .container {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            background-color: #333;
            color: #fff;
            padding: 10px 20px;
            font-size: 18px;
            text-align: center;
        }
        /* Style for the PDF viewer */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>My PDF Document Viewer</header>
        
        <!-- You can change 'your-file.pdf' to your local filename or online PDF URL -->
        <iframe src="card 1.pdf" type="application/pdf">
            <p>Your browser does not support PDFs. 
               <a href="card 1.pdf">Download the PDF</a> instead.
            </p>
        </iframe>
    </div>

</body>
</html>
