<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <title>PDF Responsive Web Viewer</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PDF.js library to render PDF on HTML Canvas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        .checkerboard {
            background-image: linear-gradient(45deg, #e2e8f0 25%, transparent 25%), 
                              linear-gradient(-45deg, #e2e8f0 25%, transparent 25%), 
                              linear-gradient(45deg, transparent 75%, #e2e8f0 75%), 
                              linear-gradient(-45deg, transparent 75%, #e2e8f0 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
        }
    </style>
</head>
<body class="h-full bg-slate-100 text-slate-800 flex flex-col overflow-hidden">

  <!-- Header Navigation -->
  <header class="h-16 bg-white border-b border-slate-200 px-4 sm:px-6 flex items-center justify-between z-30 shrink-0 shadow-sm">
    <div class="flex items-center space-x-3">
      <h1 class="font-bold text-slate-900 text-sm sm:text-base"><i class="fa-solid fa-file-pdf text-indigo-600 mr-2"></i>PDF Web Viewer</h1>
    </div>

    <!-- Controls: Download Button -->
    <div class="flex items-center space-x-3">
      <button onclick="downloadPDFWithProgress()" class="px-3.5 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl font-medium text-xs shadow-md flex items-center space-x-1.5 transition">
        <i class="fa-solid fa-download"></i>
        <span>Download PDF</span>
      </button>
    </div>
  </header>

  <!-- App Layout Container -->
  <div class="flex-1 flex overflow-hidden relative">
    
    <!-- Main Workspace Area with ample padding from all sides -->
    <main class="flex-1 bg-slate-200/70 checkerboard relative flex items-center justify-center overflow-hidden p-4 sm:p-8" id="workspaceContainer">
      <div id="canvasViewport" class="absolute inset-4 sm:inset-8 flex items-center justify-center overflow-auto p-2">
        <div id="canvasWrapper" class="relative shadow-2xl bg-white rounded-xl overflow-hidden border border-slate-300 flex items-center justify-center p-3 sm:p-4 gap-4 max-w-full max-h-full">
          <canvas id="pdfCanvas1" class="max-w-full max-h-full object-contain shadow-sm"></canvas>
          <canvas id="pdfCanvas2" class="max-w-full max-h-full object-contain shadow-sm hidden"></canvas>
        </div>
      </div>

      <!-- Page Switching Widget -->
      <div class="absolute bottom-6 bg-white/95 backdrop-blur border border-slate-200 rounded-2xl px-4 py-2.5 shadow-xl z-20 flex items-center space-x-4">
        <button onclick="changePage(-stepCount)" class="w-8 h-8 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 flex items-center justify-center transition">
          <i class="fa-solid fa-chevron-left text-xs"></i>
        </button>
        <span class="text-xs font-semibold text-slate-700">Page <span id="currentPageNum">1</span> of <span id="totalPageCount">1</span></span>
        <button onclick="changePage(stepCount)" class="w-8 h-8 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 flex items-center justify-center transition">
          <i class="fa-solid fa-chevron-right text-xs"></i>
        </button>
      </div>
    </main>
  </div>

  <!-- Progress Popup Modal -->
  <div id="progressModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center hidden">
    <div class="bg-white rounded-2xl p-6 w-80 shadow-2xl border border-slate-100 flex flex-col items-center text-center">
      <div id="modalIcon" class="w-12 h-12 rounded-full bg-indigo-50 text-indigo-600 flex items-center justify-center text-lg mb-3">
        <i class="fa-solid fa-spinner fa-spin"></i>
      </div>
      <h3 id="modalTitle" class="font-bold text-slate-900 text-sm mb-1">Loading PDF...</h3>
      <p id="modalDesc" class="text-xs text-slate-500 mb-4">Please wait while the file is being processed.</p>
      
      <!-- Progress Bar -->
      <div class="w-full bg-slate-100 rounded-full h-2 mb-2 overflow-hidden">
        <div id="progressBar" class="bg-indigo-600 h-2 rounded-full transition-all duration-150" style="width: 0%"></div>
      </div>
      <span id="progressText" class="text-xs font-semibold text-slate-600">0%</span>
    </div>
  </div>

  <script>
    let pdfDoc = null;
    let pageNum = 1;
    let canvas1 = document.getElementById('pdfCanvas1');
    let ctx1 = canvas1.getContext('2d');
    let canvas2 = document.getElementById('pdfCanvas2');
    let ctx2 = canvas2.getContext('2d');

    // Default pre-loaded PDF file path or URL
    const defaultPdfUrl = 'final cv.pdf'; 

    // Determine step count: 1 page for mobile screens (< 768px), 2 pages for desktop side-by-side
    let stepCount = window.innerWidth < 768 ? 1 : 2;

    window.onload = function() {
      loadPDFWithProgress(defaultPdfUrl);
    };

    window.onresize = function() {
      let newStep = window.innerWidth < 768 ? 1 : 2;
      if (newStep !== stepCount) {
        stepCount = newStep;
        pageNum = 1; // Reset to start when switching view modes
      }
      if (pdfDoc) {
        renderPages(pageNum);
      }
    };

    function showModal(title, desc) {
      document.getElementById('modalTitle').textContent = title;
      document.getElementById('modalDesc').textContent = desc;
      document.getElementById('progressBar').style.width = '0%';
      document.getElementById('progressText').textContent = '0%';
      document.getElementById('progressModal').classList.remove('hidden');
    }

    function updateProgress(percent) {
      document.getElementById('progressBar').style.width = percent + '%';
      document.getElementById('progressText').textContent = percent + '%';
    }

    function hideModal() {
      document.getElementById('progressModal').classList.add('hidden');
    }

    async function loadPDFWithProgress(url) {
      showModal("Loading PDF", "Fetching document to display on page...");
      
      try {
        const loadingTask = pdfjsLib.getDocument(url);
        
        loadingTask.onProgress = function(progressData) {
          if (progressData.total > 0) {
            let percent = Math.round((progressData.loaded / progressData.total) * 100);
            updateProgress(percent);
          } else {
            updateProgress(50);
          }
        };

        pdfDoc = await loadingTask.promise;
        updateProgress(100);
        document.getElementById('totalPageCount').textContent = pdfDoc.numPages;
        pageNum = 1;
        
        await renderPages(pageNum);
        setTimeout(hideModal, 400);
      } catch (error) {
        hideModal();
        console.error("Error loading PDF:", error);
        alert("Could not load PDF. Make sure 'your-file.pdf' exists in the directory or check file path permissions.");
      }
    }

    // Render pages dynamically based on screen width (1 for mobile, 2 for desktop)
    async function renderPages(num) {
      if (!pdfDoc) return;

      stepCount = window.innerWidth < 768 ? 1 : 2;
      const viewportContainer = document.getElementById('workspaceContainer');
      
      let containerWidth, containerHeight;
      if (stepCount === 2) {
        containerWidth = (viewportContainer.clientWidth - 90) / 2;
        containerHeight = viewportContainer.clientHeight - 80;
      } else {
        containerWidth = viewportContainer.clientWidth - 50;
        containerHeight = viewportContainer.clientHeight - 80;
      }

      // Render Page 1
      const page1 = await pdfDoc.getPage(num);
      const unscaledV1 = page1.getViewport({ scale: 1.0 });
      const scaleX1 = containerWidth / unscaledV1.width;
      const scaleY1 = containerHeight / unscaledV1.height;
      const fitScale1 = Math.min(scaleX1, scaleY1);

      const viewport1 = page1.getViewport({ scale: fitScale1 });
      canvas1.height = viewport1.height;
      canvas1.width = viewport1.width;
      await page1.render({ canvasContext: ctx1, viewport: viewport1 }).promise;

      let displayEndNum = num;

      // Render Page 2 if stepCount is 2 and second page exists
      if (stepCount === 2 && num + 1 <= pdfDoc.numPages) {
        canvas2.classList.remove('hidden');
        const page2 = await pdfDoc.getPage(num + 1);
        const unscaledV2 = page2.getViewport({ scale: 1.0 });
        const scaleX2 = containerWidth / unscaledV2.width;
        const scaleY2 = containerHeight / unscaledV2.height;
        const fitScale2 = Math.min(scaleX2, scaleY2);

        const viewport2 = page2.getViewport({ scale: fitScale2 });
        canvas2.height = viewport2.height;
        canvas2.width = viewport2.width;
        await page2.render({ canvasContext: ctx2, viewport: viewport2 }).promise;
        displayEndNum = num + 1;
      } else {
        canvas2.classList.add('hidden');
      }

      // Update page indicator text
      if (num === displayEndNum) {
        document.getElementById('currentPageNum').textContent = num;
      } else {
        document.getElementById('currentPageNum').textContent = `${num}-${displayEndNum}`;
      }
    }

    function changePage(val) {
      if (!pdfDoc) return;
      let newPage = pageNum + val;
      if (newPage < 1) newPage = 1;
      if (newPage > pdfDoc.numPages) return;
      pageNum = newPage;
      renderPages(pageNum);
    }

    async function downloadPDFWithProgress() {
      showModal("Preparing Download", "Fetching file for download...");
      updateProgress(20);

      try {
        const response = await fetch(defaultPdfUrl);
        updateProgress(50);
        
        const blob = await response.blob();
        updateProgress(80);

        const blobUrl = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = blobUrl;
        a.download = defaultPdfUrl.split('/').pop() || 'document.pdf';
        document.body.appendChild(a);
        
        updateProgress(100);
        setTimeout(() => {
          a.click();
          document.body.removeChild(a);
          window.URL.revokeObjectURL(blobUrl);
          hideModal();
        }, 500);
      } catch (err) {
        hideModal();
        console.error("Download failed:", err);
        const a = document.createElement('a');
        a.href = defaultPdfUrl;
        a.download = 'document.pdf';
        a.click();
      }
    }
  </script>
</body>
</html>
