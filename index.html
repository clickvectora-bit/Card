<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <title>PDF Web Page Viewer - Fit to Screen</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PDF.js library to render PDF on HTML Canvas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        .checkerboard {
            background-image: linear-gradient(45deg, #e2e8f0 25%, transparent 25%), 
                              linear-gradient(-45deg, #e2e8f0 25%, transparent 25%), 
                              linear-gradient(45deg, transparent 75%, #e2e8f0 75%), 
                              linear-gradient(-45deg, transparent 75%, #e2e8f0 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
        }
    </style>
</head>
<body class="h-full bg-slate-100 text-slate-800 flex flex-col overflow-hidden">

  <!-- Header Navigation -->
  <header class="h-16 bg-white border-b border-slate-200 px-4 flex items-center justify-between z-30 shrink-0 shadow-sm">
    <div class="flex items-center space-x-3">
      <h1 class="font-bold text-slate-900 text-sm sm:text-base"><i class="fa-solid fa-file-pdf text-indigo-600 mr-2"></i>PDF Web Page Viewer</h1>
    </div>

    <!-- Controls: Download Button -->
    <div class="flex items-center space-x-3">
      <button onclick="downloadPDFWithProgress()" class="px-3 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl font-medium text-xs shadow-md flex items-center space-x-1.5 transition">
        <i class="fa-solid fa-download"></i>
        <span>Download PDF</span>
      </button>
    </div>
  </header>

  <!-- App Layout Container -->
  <div class="flex-1 flex overflow-hidden relative">
    
    <!-- Main Workspace Area where PDF renders on Canvas -->
    <main class="flex-1 bg-slate-200/70 checkerboard relative flex items-center justify-center overflow-hidden" id="workspaceContainer">
      <div id="canvasViewport" class="absolute inset-0 flex items-center justify-center overflow-auto p-4">
        <div id="canvasWrapper" class="relative shadow-2xl bg-white rounded-lg overflow-hidden border border-slate-300 flex items-center justify-center">
          <canvas id="pdfCanvas" class="max-w-full max-h-full object-contain"></canvas>
        </div>
      </div>

      <!-- Page Switching Widget -->
      <div class="absolute bottom-6 bg-white/90 backdrop-blur border border-slate-200 rounded-2xl px-4 py-2.5 shadow-xl z-20 flex items-center space-x-4">
        <button onclick="changePage(-1)" class="w-8 h-8 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 flex items-center justify-center transition">
          <i class="fa-solid fa-chevron-left text-xs"></i>
        </button>
        <span class="text-xs font-semibold text-slate-700">Page <span id="currentPageNum">1</span> of <span id="totalPageCount">1</span></span>
        <button onclick="changePage(1)" class="w-8 h-8 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 flex items-center justify-center transition">
          <i class="fa-solid fa-chevron-right text-xs"></i>
        </button>
      </div>
    </main>
  </div>

  <!-- Progress Popup Modal -->
  <div id="progressModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center hidden">
    <div class="bg-white rounded-2xl p-6 w-80 shadow-2xl border border-slate-100 flex flex-col items-center text-center">
      <div id="modalIcon" class="w-12 h-12 rounded-full bg-indigo-50 text-indigo-600 flex items-center justify-center text-lg mb-3">
        <i class="fa-solid fa-spinner fa-spin"></i>
      </div>
      <h3 id="modalTitle" class="font-bold text-slate-900 text-sm mb-1">Loading PDF...</h3>
      <p id="modalDesc" class="text-xs text-slate-500 mb-4">Please wait while the file is being processed.</p>
      
      <!-- Progress Bar -->
      <div class="w-full bg-slate-100 rounded-full h-2 mb-2 overflow-hidden">
        <div id="progressBar" class="bg-indigo-600 h-2 rounded-full transition-all duration-150" style="width: 0%"></div>
      </div>
      <span id="progressText" class="text-xs font-semibold text-slate-600">0%</span>
    </div>
  </div>

  <script>
    let pdfDoc = null;
    let pageNum = 1;
    let canvas = document.getElementById('pdfCanvas');
    let ctx = canvas.getContext('2d');

    // Default pre-loaded PDF file path or URL
    const defaultPdfUrl = 'card 1.pdf'; 

    window.onload = function() {
      loadPDFWithProgress(defaultPdfUrl);
    };

    // Re-render current page dynamically if the window size changes to maintain full-screen fit
    window.onresize = function() {
      if (pdfDoc) {
        renderPage(pageNum);
      }
    };

    // Show Progress Popup Modal
    function showModal(title, desc) {
      document.getElementById('modalTitle').textContent = title;
      document.getElementById('modalDesc').textContent = desc;
      document.getElementById('progressBar').style.width = '0%';
      document.getElementById('progressText').textContent = '0%';
      document.getElementById('progressModal').classList.remove('hidden');
    }

    // Update Progress Bar
    function updateProgress(percent) {
      document.getElementById('progressBar').style.width = percent + '%';
      document.getElementById('progressText').textContent = percent + '%';
    }

    // Hide Progress Popup Modal
    function hideModal() {
      document.getElementById('progressModal').classList.add('hidden');
    }

    // Load PDF automatically with progress tracking
    async function loadPDFWithProgress(url) {
      showModal("Loading PDF", "Fetching document to display on page...");
      
      try {
        const loadingTask = pdfjsLib.getDocument(url);
        
        loadingTask.onProgress = function(progressData) {
          if (progressData.total > 0) {
            let percent = Math.round((progressData.loaded / progressData.total) * 100);
            updateProgress(percent);
          } else {
            updateProgress(50);
          }
        };

        pdfDoc = await loadingTask.promise;
        updateProgress(100);
        document.getElementById('totalPageCount').textContent = pdfDoc.numPages;
        pageNum = 1;
        
        await renderPage(pageNum);
        setTimeout(hideModal, 400);
      } catch (error) {
        hideModal();
        console.error("Error loading PDF:", error);
        alert("Could not load PDF. Make sure PDF exists in the directory or check file path permissions.");
      }
    }

    // Render individual page and scale it dynamically to fit browser screen boundaries
    async function renderPage(num) {
      if (!pdfDoc) return;
      const page = await pdfDoc.getPage(num);
      
      // Get container dimensions to fit page perfectly inside viewport area
      const viewportContainer = document.getElementById('canvasViewport');
      const containerWidth = viewportContainer.clientWidth - 40;
      const containerHeight = viewportContainer.clientHeight - 40;

      // Unscaled standard page viewport dimensions
      const unscaledViewport = page.getViewport({ scale: 1.0 });
      
      // Calculate best scale ratio for height and width fit
      const scaleX = containerWidth / unscaledViewport.width;
      const scaleY = containerHeight / unscaledViewport.height;
      const fitScale = Math.min(scaleX, scaleY);

      const viewport = page.getViewport({ scale: fitScale });
      
      canvas.height = viewport.height;
      canvas.width = viewport.width;

      const renderContext = {
        canvasContext: ctx,
        viewport: viewport
      };
      
      await page.render(renderContext).promise;
      document.getElementById('currentPageNum').textContent = num;
    }

    function changePage(val) {
      if (!pdfDoc) return;
      let newPage = pageNum + val;
      if (newPage < 1 || newPage > pdfDoc.numPages) return;
      pageNum = newPage;
      renderPage(pageNum);
    }

    // Download PDF with progress popup tracking
    async function downloadPDFWithProgress() {
      showModal("Preparing Download", "Fetching file for download...");
      updateProgress(20);

      try {
        const response = await fetch(defaultPdfUrl);
        updateProgress(50);
        
        const blob = await response.blob();
        updateProgress(80);

        const blobUrl = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = blobUrl;
        a.download = defaultPdfUrl.split('/').pop() || 'document.pdf';
        document.body.appendChild(a);
        
        updateProgress(100);
        setTimeout(() => {
          a.click();
          document.body.removeChild(a);
          window.URL.revokeObjectURL(blobUrl);
          hideModal();
        }, 500);
      } catch (err) {
        hideModal();
        console.error("Download failed:", err);
        const a = document.createElement('a');
        a.href = defaultPdfUrl;
        a.download = 'document.pdf';
        a.click();
      }
    }
  </script>
</body>
</html>
